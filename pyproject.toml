[project]
name = "bigdata-magisters-course"
version = "0.1.0"
description = "Инженерные методы обработки и анализа больших массивов данных для магистров"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "optuna>=3.5.0",
    "streamlit>=1.30.0",
    "prefect>=2.14.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "mmh3>=4.1.0",
    "boto3>=1.34.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",    # Быстрый линтер и форматировщик на Rust
    "mypy>=1.9.0",    # Статический анализатор типов для защиты от OOM
]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "duckdb.*",
    "polars.*",
    "optuna.*",
    "prefect.*",
    "boto3.*"
]
ignore_missing_imports = true

