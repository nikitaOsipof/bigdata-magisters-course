version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-58Z
    container_name: bigdata_minio
    ports:
      - "9000:9000"       # API порт (boto3, duckdb, polars)
      - "9001:9001"       # Консоль управления в браузере
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: SuperSecretPassword123
    volumes:
      - minio_academic_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_academic_data:
