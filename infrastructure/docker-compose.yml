services:
  minio:
    image: pgsty/silo:latest
    container_name: bigdata_minio
    ports:
      - "9000:9000"       # API порт (boto3, duckdb, polars)
      - "9001:9001"       # Веб-консоль управления
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: SuperSecretPassword123
    volumes:
      - minio_academic_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_academic_data:
