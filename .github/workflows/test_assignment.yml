name: Проверка лабораторных работ магистров (Полный цикл)

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
    - name: Клонирование кодовой базы
      uses: actions/checkout@v4

    - name: Установка инструмента uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Инициализация окружения Python через uv
      run: uv python install 3.11

    - name: Установка и синхронизация зависимостей курса
      run: uv sync
    # =================================================================
    # ЭТАП ЛИНТИНГА И СТАТИЧЕСКОГО КОНТРОЛЯ ТИПОВ (Ruff & Mypy)
    # =================================================================
    - name: Анализ безопасности и стиля кода (Ruff)
      run: |
        echo ">>> Запуск Ruff для поиска скрытых багов и утечек памяти..."
        # Проверяем папку assignments. Игнорируем мелкие ошибки стиля (E501 - длина строки),
        # но жестко ловим неиспользуемые переменные, синтаксические проблемы и баги (F, E, W).
        uv run ruff check assignments/ --ignore E501

    - name: Статическая верификация типов данных (Mypy)
      run: |
        echo ">>> Запуск Mypy для проверки контрактов данных..."
        # --check-untyped-defs: заставляет mypy заглядывать внутрь функций без аннотаций
        # --ignore-missing-imports: не падать, если у сторонней Big Data библиотеки нет встроенных типов
        uv run mypy assignments/ --check-untyped-defs --ignore-missing-imports


    # =================================================================
    # ЭТАП 1. СТАТИЧЕСКИЙ АНАЛИЗ (Анти-чит контроль на векторизацию)
    # =================================================================
    - name: Проверка на использование запрещенных циклов в Big Data коде
      run: |
        # Проверяем Практику 1 (DuckDB) и Практику 5 (Дирихле) на построчные циклы
        if grep -q "for row in" assignments/practice_01_lazy.py || grep -q "for row in" assignments/practice_05_online_ml.py; then
          echo "🚨 Ошибка: В Big Data задачах обнаружен перебор строк циклом. Используйте векторизованный API движков!"
          exit 1
        fi

    - name: Проверка Практики 3 (Фильтр Блума) на использование готовых библиотек
      run: |
        # Студент должен написать побитовые сдвиги сам, а не импортировать готовый BloomFilter
        if grep -q "from bloom_filter" assignments/practice_03_bloom.py || grep -q "import pybloom" assignments/practice_03_bloom.py; then
          echo "🚨 Ошибка: Запрещено использовать готовые библиотеки Фильтра Блума. Реализуйте алгоритм на побитовых сдвигах самостоятельно согласно ТЗ!"
          exit 1
        fi

    # =================================================================
    # ЭТАП 2. ДИНАМИЧЕСКИЙ АНАЛИЗ (Вычислительное тестирование)
    # =================================================================
    - name: Тестирование вычислительных скриптов (Практики 1-7)
      run: |
        echo "🔥 Старт сквозного тестирования математической логики..."
        
        echo ">>> Тест Практики 1 (Out-of-Core DuckDB)"
        uv run python assignments/practice_01_lazy.py
        
        echo ">>> Тест Практики 2 (Инкрементальное Бета-сопряжение)"
        uv run python assignments/practice_02_bayesian.py
        
        echo ">>> Тест Практики 3 (Побитовый Фильтр Блума)"
        uv run python assignments/practice_03_bloom.py
        
        echo ">>> Тест Практики 5 (Мультиномиальное распределение Дирихле)"
        uv run python assignments/practice_05_online_ml.py
        
        echo ">>> Тест Практики 6 (Байесовский подбор в Optuna)"
        uv run python assignments/practice_06_optuna.py
        
        echo ">>> Тест Практики 7 (Оркестрация DataOps в Prefect)"
        uv run python assignments/practice_07_prefect.py

    # =================================================================
    # ЭТАП 3. СПЕЦИФИЧЕСКИЕ ИНФРАСТРУКТУРНЫЕ ТЕСТЫ (S3 и Streamlit)
    # =================================================================
    - name: Тест Практики 4 (Синтаксис S3 плагина в DuckDB)
      run: |
        # Так как в облаке GitHub Actions нет запущенного Docker MinIO, 
        # мы проверяем код Практики 4 на отсутствие критических синтаксических ошибок компиляции
        uv run python -m py_compile assignments/practice_04_s3.py

    - name: Тест Практики 8 (Инспекция Streamlit дашборда)
      run: |
        # Проверяем, что в коде дашборда импортированы нужные библиотеки и нет опечаток
        uv run python -m py_compile assignments/app.py
        
        # Статический чек: студент должен был использовать st.pyplot() или st.metric()
        if ! grep -q "st.pyplot" assignments/app.py; then
          echo "🚨 Ошибка: В коде Streamlit-приложения не обнаружен вывод графиков через st.pyplot()!"
          exit 1
        fi

    - name: Итог проверки
      run: echo "🟢 Поздравляем! Все 8 практических работ успешно прошли автоматическую верификацию."
